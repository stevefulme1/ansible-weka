---
# extensions/audit/event_query.yml
# Maps WekaIO module return values to the AAP Normalized Resource Taxonomy.
# Return key is the resource type dict (e.g. filesystem, cluster, node).
# Each dict contains "id" and "name" fields from the Weka REST API.

stevefulme1.weka.weka_filesystem:
  query: >-
    {
      name: .filesystem.name,
      canonical_facts: {
        uuid: .filesystem.id
      },
      facts: {
        device_type: "file_storage"
      }
    }

stevefulme1.weka.weka_cluster:
