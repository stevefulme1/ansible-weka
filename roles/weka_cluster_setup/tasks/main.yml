---
# tasks/main.yml for weka_cluster_setup
# Deploy and configure Weka cluster

- name: Validate required variables
  ansible.builtin.assert:
    that:
      - weka_cluster_setup_host is defined
    fail_msg: "weka_cluster_setup_host must be defined"
    quiet: true

- name: Execute weka cluster setup
  ansible.builtin.debug:
    msg: >-
      Deploy and configure Weka cluster.
      Target: {{ weka_cluster_setup_host }}
