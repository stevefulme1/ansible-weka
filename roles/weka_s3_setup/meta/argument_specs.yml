---
argument_specs:
  main:
    short_description: "Configure S3 gateway with IAM policies"
    options:
      weka_s3_setup_host:
        description: Target host address
        type: str
        required: true
      weka_s3_setup_username:
        description: Authentication username
        type: str
      weka_s3_setup_password:
        description: Authentication password
        type: str
      weka_s3_setup_api_key:
        description: API key for authentication
        type: str
      weka_s3_setup_validate_certs:
        description: Validate SSL certificates
        type: bool
        default: true
      weka_s3_setup_state:
        description: Desired state
        type: str
        default: present
        choices: [present, absent]
