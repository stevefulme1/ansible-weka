---
# Integration tests for stevefulme1.weka.weka_kms

- name: List weka_kms resources
  stevefulme1.weka.weka_kms_info:
    host: "{{ weka_host | default('localhost') }}"
    username: "{{ weka_username | default('admin') }}"
    password: "{{ weka_password | default('password') }}"
    validate_certs: "{{ weka_validate_certs | default(false) }}"
  register: list_result

- name: Verify weka_kms listing
  ansible.builtin.assert:
    that:
      - list_result is not failed

- name: Create weka_kms (check_mode)
  stevefulme1.weka.weka_kms:
    host: "{{ weka_host | default('localhost') }}"
    username: "{{ weka_username | default('admin') }}"
    password: "{{ weka_password | default('password') }}"
    validate_certs: "{{ weka_validate_certs | default(false) }}"
    name: "ansible-test-{{ resource_prefix }}"
    state: present
  check_mode: true
  register: check_result

- name: Verify check_mode reports changed
  ansible.builtin.assert:
    that:
      - check_result is changed

- name: Create weka_kms
  stevefulme1.weka.weka_kms:
    host: "{{ weka_host | default('localhost') }}"
    username: "{{ weka_username | default('admin') }}"
    password: "{{ weka_password | default('password') }}"
