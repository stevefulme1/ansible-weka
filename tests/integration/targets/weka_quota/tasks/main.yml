---
# Integration tests for stevefulme1.weka.weka_quota

- name: List weka_quota resources
  stevefulme1.weka.weka_quota_info:
    host: "{{ weka_host | default('localhost') }}"
    username: "{{ weka_username | default('admin') }}"
    password: "{{ weka_password | default('password') }}"
    validate_certs: "{{ weka_validate_certs | default(false) }}"
  register: list_result

- name: Verify weka_quota listing
  ansible.builtin.assert:
    that:
      - list_result is not failed

- name: Create weka_quota (check_mode)
  stevefulme1.weka.weka_quota:
    host: "{{ weka_host | default('localhost') }}"
    username: "{{ weka_username | default('admin') }}"
    password: "{{ weka_password | default('password') }}"
    validate_certs: "{{ weka_validate_certs | default(false) }}"
    name: "ansible-test-{{ resource_prefix }}"
    state: present
  check_mode: true
  register: check_result

- name: Verify check_mode reports changed
  ansible.builtin.assert:
    that:
      - check_result is changed

- name: Create weka_quota
  stevefulme1.weka.weka_quota:
    host: "{{ weka_host | default('localhost') }}"
    username: "{{ weka_username | default('admin') }}"
    password: "{{ weka_password | default('password') }}"
    validate_certs: "{{ weka_validate_certs | default(false) }}"
    name: "ansible-test-{{ resource_prefix }}"
