    state: absent
  register: delete_result

- name: Verify weka_quota was deleted
  ansible.builtin.assert:
    that:
      - delete_result is changed

- name: Delete weka_quota again (idempotent)
  stevefulme1.weka.weka_quota:
    host: "{{ weka_host | default('localhost') }}"
    username: "{{ weka_username | default('admin') }}"
    password: "{{ weka_password | default('password') }}"
    validate_certs: "{{ weka_validate_certs | default(false) }}"
