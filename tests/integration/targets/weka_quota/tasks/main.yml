- name: Create weka_quota again (idempotency)
  stevefulme1.weka.weka_quota:
    host: "{{ weka_host | default('localhost') }}"
    username: "{{ weka_username | default('admin') }}"
    password: "{{ weka_password | default('password') }}"
    validate_certs: "{{ weka_validate_certs | default(false) }}"
    name: "ansible-test-{{ resource_prefix }}"
    state: present
  register: idem_result

- name: Verify idempotent create
  ansible.builtin.assert:
    that:
      - idem_result is not changed

- name: Delete weka_quota (check_mode)
  stevefulme1.weka.weka_quota:
    host: "{{ weka_host | default('localhost') }}"
    username: "{{ weka_username | default('admin') }}"
    password: "{{ weka_password | default('password') }}"
    validate_certs: "{{ weka_validate_certs | default(false) }}"
    name: "ansible-test-{{ resource_prefix }}"
    state: absent
  check_mode: true
  register: delete_check

- name: Verify check_mode delete reports changed
  ansible.builtin.assert:
    that:
      - delete_check is changed

- name: Delete weka_quota
  stevefulme1.weka.weka_quota:
    host: "{{ weka_host | default('localhost') }}"
    username: "{{ weka_username | default('admin') }}"
    password: "{{ weka_password | default('password') }}"
    validate_certs: "{{ weka_validate_certs | default(false) }}"
